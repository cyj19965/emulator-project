<script id="solver-src" type="text/plain">
function listMoves(b, R, C) {
  const W = C + 1;
  const S = new Int32Array((R + 1) * W), N = new Int32Array((R + 1) * W);
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    const v = b[r * C + c], i = (r + 1) * W + c + 1;
    S[i] = v + S[i - 1] + S[i - W] - S[i - W - 1];
    N[i] = (v ? 1 : 0) + N[i - 1] + N[i - W] - N[i - W - 1];
  }
  const sum = (A, r1, c1, r2, c2) => A[(r2 + 1) * W + c2 + 1] - A[r1 * W + c2 + 1] - A[(r2 + 1) * W + c1] + A[r1 * W + c1];
  const out = [];
  for (let r1 = 0; r1 < R; r1++) for (let r2 = r1; r2 < R; r2++) for (let c1 = 0; c1 < C; c1++) {
    if (sum(N, r1, c1, r2, c1) === 0) continue;
    for (let c2 = c1; c2 < C; c2++) {
      const s = sum(S, r1, c1, r2, c2);
      if (s > 10) break;
      if (s < 10) continue;
      if (sum(N, r1, c2, r2, c2) === 0) continue;
      if (sum(N, r1, c1, r1, c2) === 0 || sum(N, r2, c1, r2, c2) === 0) continue;
      out.push([r1, c1, r2, c2, sum(N, r1, c1, r2, c2)]);
    }
  }
  return out;
}
function applyMove(b, C, m) {
  const nb = b.slice();
  for (let r = m[0]; r <= m[2]; r++) for (let c = m[1]; c <= m[3]; c++) nb[r * C + c] = 0;
  return nb;
}
// rollout policy: among legal rectangles, take one that removes the fewest apples
function pick(ms) {
  let mn = 99; for (const m of ms) if (m[4] < mn) mn = m[4];
  const c = ms.filter(m => m[4] === mn);
  return c[(Math.random() * c.length) | 0];
}
function rollout(b, R, C) {
  let s = 0; const seq = [];
  for (;;) { const ms = listMoves(b, R, C); if (!ms.length) return { s, seq }; const m = pick(ms); b = applyMove(b, C, m); s += m[4]; seq.push(m); }
}
// level-1 nested Monte Carlo search; on deadline, finishes with the best line found so far
function nmcs(board, R, C, deadline) {
  let b = board, score = 0, bestSeq = [], bestTotal = -1; const done = [];
  for (;;) {
    const ms = listMoves(b, R, C); if (!ms.length) break;
    for (const m of ms) {
      const r = rollout(applyMove(b, C, m), R, C), tot = score + m[4] + r.s;
      if (tot > bestTotal) { bestTotal = tot; bestSeq = [m, ...r.seq]; }
      if (Date.now() > deadline) return { score: bestTotal, moves: done.concat(bestSeq) };
    }
    const m = bestSeq.shift(); done.push(m); b = applyMove(b, C, m); score += m[4];
  }
  return { score, moves: done };
}
onmessage = e => {
  const { board, R, C, deadline } = e.data;
  const b = Int8Array.from(board);
  let best = { score: -1, moves: [] }, runs = 0;
  do { const r = nmcs(b, R, C, deadline); runs++; if (r.score > best.score) best = r; } while (Date.now() < deadline);
  postMessage({ score: best.score, moves: best.moves, runs });
};
</script>

// ---------- recognition ----------
function findApples(px, w, h) {
  const n = w * h, mask = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    const r = px[i * 4], g = px[i * 4 + 1], b = px[i * 4 + 2];
    mask[i] = r > 150 && r - g > 90 && r - b > 90 ? 1 : 0;
  }
  const lab = new Int32Array(n), comps = [], stack = new Int32Array(n);
  for (let s = 0; s < n; s++) {
    if (!mask[s] || lab[s]) continue;
    const id = comps.length + 1;
    let sp = 0, area = 0, x0 = w, y0 = h, x1 = -1, y1 = -1;
    stack[sp++] = s; lab[s] = id;
    while (sp) {
      const p = stack[--sp], x = p % w, y = (p / w) | 0;
      area++;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      if (x > 0 && mask[p - 1] && !lab[p - 1]) { lab[p - 1] = id; stack[sp++] = p - 1; }
      if (x < w - 1 && mask[p + 1] && !lab[p + 1]) { lab[p + 1] = id; stack[sp++] = p + 1; }
      if (y > 0 && mask[p - w] && !lab[p - w]) { lab[p - w] = id; stack[sp++] = p - w; }
      if (y < h - 1 && mask[p + w] && !lab[p + w]) { lab[p + w] = id; stack[sp++] = p + w; }
    }
    comps.push({ area, x0, y0, x1, y1, bw: x1 - x0 + 1, bh: y1 - y0 + 1 });
  }
  let cand = comps.filter(c => c.bw >= 8 && c.bh >= 8 && c.bw / c.bh > 0.7 && c.bw / c.bh < 1.4 && c.area > 0.4 * c.bw * c.bh);
  if (!cand.length) return null;
  const sizes = cand.map(c => c.bw).sort((a, b) => a - b), med = sizes[sizes.length >> 1];
  cand = cand.filter(c => c.bw > med * 0.8 && c.bw < med * 1.25);
  const cluster = (vals, gap) => {
    const s = [...vals].sort((a, b) => a - b), cs = [[s[0]]];
    for (let i = 1; i < s.length; i++) (s[i] - s[i - 1] > gap ? cs.push([s[i]]) : cs[cs.length - 1].push(s[i]));
    return cs.map(c => c.reduce((a, b) => a + b, 0) / c.length);
  };
  for (const c of cand) { c.cx = (c.x0 + c.x1) / 2; c.cy = (c.y0 + c.y1) / 2; }
  const cols = cluster(cand.map(c => c.cx), med / 2), rows = cluster(cand.map(c => c.cy), med / 2);
  const near = (arr, v) => { let bi = 0; for (let i = 1; i < arr.length; i++) if (Math.abs(arr[i] - v) < Math.abs(arr[bi] - v)) bi = i; return bi; };
  for (const c of cand) {
    c.col = near(cols, c.cx); c.row = near(rows, c.cy);
    const f = new Float32Array(FS * FS);
    for (let fy = 0; fy < FS; fy++) for (let fx = 0; fx < FS; fx++) {
      const ya = c.y0 + Math.floor(fy * c.bh / FS), yb = Math.max(ya + 1, c.y0 + Math.floor((fy + 1) * c.bh / FS));
      const xa = c.x0 + Math.floor(fx * c.bw / FS), xb = Math.max(xa + 1, c.x0 + Math.floor((fx + 1) * c.bw / FS));
      let s = 0, k = 0;
      for (let y = ya; y < yb; y++) for (let x = xa; x < xb; x++) {
        const p = (y * w + x) * 4, r = px[p], g = px[p + 1];
        s += r > 150 ? Math.min(1, Math.max(0, (g - 51) / 202)) : 0; k++;
      }
      f[fy * FS + fx] = s / k;
    }
    c.f = f;
  }
  return { rows, cols, apples: cand };
}
function classify(f) {
  let best = 0, bd = Infinity, second = Infinity;
  for (let d = 1; d <= 9; d++) {
    const t = TEMPLATES[d - 1]; let s = 0;
    for (let i = 0; i < t.length; i++) { const e = f[i] - t[i]; s += e * e; }
    if (s < bd) { second = bd; bd = s; best = d; } else if (s < second) second = s;
  }
  return { digit: best, dist: bd, margin: second / Math.max(bd, 1e-6) };
}

async function handleImage(blob) {
  if (!blob || !blob.type.startsWith("image/")) return setStatus("이미지 파일이 아닙니다. 스크린샷 이미지를 넣어 주세요.", true);
  setStatus("인식 중…");
  try {
    const bmp = await createImageBitmap(blob);
    const cv = document.createElement("canvas"); cv.width = bmp.width; cv.height = bmp.height;
    const ctx = cv.getContext("2d", { willReadFrequently: true }); ctx.drawImage(bmp, 0, 0);
    const g = findApples(ctx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height);
    if (!g) return setStatus("사과를 찾지 못했습니다. 게임 판 전체가 보이게 캡처해 주세요.", true);
    const R = g.rows.length, C = g.cols.length, board = new Array(R * C).fill(0), low = new Set();
    for (const a of g.apples) {
      const r = classify(a.f), i = a.row * C + a.col;
      board[i] = r.digit;
      if (r.margin < 1.2) low.add(i);
    }
    loadBoard(board, R, C, low, `인식 완료: ${g.apples.length}개 (${R}행 × ${C}열)`);
  } catch (e) {
    setStatus("이미지를 읽지 못했습니다: " + e.message, true);
  }
}

// ---------- solving ----------
// Solid rectangles (no empty cell inside) need no earlier move, so they go first in
// top-left order (row, then column); moves that span emptied cells keep their order after them.
function orderMoves(moves) {
  const solid = m => (m[2] - m[0] + 1) * (m[3] - m[1] + 1) === m[4];
  const first = moves.filter(solid).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  return first.concat(moves.filter(m => !solid(m)));
}

const workerURL = URL.createObjectURL(new Blob([$("solver-src").textContent], { type: "text/javascript" }));
const NW = Math.max(1, Math.min(8, navigator.hardwareConcurrency || 4));
$("workers").textContent = `병렬 탐색 ${NW}개 동시 실행. 탐색 시간이 길수록 점수가 오를 수 있지만 보장되지는 않으며, 게임 타이머도 그만큼 흐릅니다.`;

function solve(prefix = "") {
  const { R, C, board } = state;
  const budget = +$("budget").value, deadline = Date.now() + budget, t0 = performance.now();
  state.solving = true; state.moves = []; state.steps = []; state.step = 0; render();
  setStatus(`탐색 중… (${budget / 1000}초)`);
  let left = NW, best = { score: -1, moves: [] }, runs = 0;
  for (let k = 0; k < NW; k++) {
    const w = new Worker(workerURL);
    w.onmessage = e => {
      runs += e.data.runs;
      if (e.data.score > best.score) best = e.data;
      w.terminate();
      if (--left === 0) {
        state.solving = false; state.moves = orderMoves(best.moves); state.steps = buildSteps(state.moves); state.score = best.score; state.step = 0;
        setStatus(`${prefix}${((performance.now() - t0) / 1000).toFixed(1)}초 탐색 · ${best.moves.length}수 · 시도 ${runs}회`);
        render();
      }
    };
    w.onerror = e => { setStatus("탐색 오류: " + e.message, true); };
    w.postMessage({ board, R, C, deadline });
  }
}

// ---------- UI ----------
function setStatus(t, err) { $("status").textContent = t; $("status").classList.toggle("err", !!err); }

function loadBoard(board, R, C, low, msg) {
  Object.assign(state, { board, R, C, low, sel: -1 });
  const warn = [];
  const n = board.filter(v => v).length;
  if (R !== 10 || C !== 17) warn.push(`격자가 ${R}×${C}로 인식되었습니다 (보통 10×17).`);
  if (n !== R * C) warn.push(`빈 칸 ${R * C - n}개가 있습니다.`);
  if (low.size) warn.push(`확신도 낮은 칸 ${low.size}개 (주황 테두리). 실제 숫자와 비교해 주세요.`);
  $("warn").hidden = !warn.length; $("warn").textContent = warn.join(" ");
  buildBoard();
  solve(msg + " · ");
}

function buildBoard() {
  const { R, C } = state, el = $("board");
  el.style.gridTemplateColumns = `repeat(${C}, minmax(0, 1fr))`;
  el.innerHTML = "";
  for (let i = 0; i < R * C; i++) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "cell"; b.dataset.i = i;
    b.style.gridRow = ((i / C) | 0) + 1; b.style.gridColumn = (i % C) + 1;
    b.setAttribute("aria-label", `${((i / C) | 0) + 1}행 ${(i % C) + 1}열`);
    el.appendChild(b);
  }
  render();
}

// One step shows every solid rectangle at once (they are independent); each later move is its own step.
function buildSteps(moves) {
  const solid = m => (m[2] - m[0] + 1) * (m[3] - m[1] + 1) === m[4];
  let n = 0; while (n < moves.length && solid(moves[n])) n++;
  const steps = n ? [Array.from({ length: n }, (_, i) => i)] : [];
  for (let i = n; i < moves.length; i++) steps.push([i]);
  return steps;
}

function render() {
  const { R, C, board, moves, steps, step, low, sel } = state;
  const gone = new Uint8Array(R * C), stepOf = [];
  steps.forEach((s, k) => s.forEach(i => { stepOf[i] = k; }));
  let removed = 0;
  moves.forEach((m, i) => {
    if (stepOf[i] >= step) return;
    removed += m[4];
    for (let r = m[0]; r <= m[2]; r++) for (let c = m[1]; c <= m[3]; c++) gone[r * C + c] = 1;
  });
  const el = $("board");
  el.querySelectorAll(".cell").forEach(b => {
    const i = +b.dataset.i, v = board[i];
    b.textContent = v || "";
    b.className = "cell" + (!v ? " empty" : gone[i] ? " gone" : "") + (low.has(i) ? " low" : "") + (sel === i ? " sel" : "");
  });
  el.querySelectorAll(".rect").forEach(d => d.remove());
  const place = (cls, m) => {
    const d = document.createElement("div"); d.className = "rect " + cls;
    d.style.gridArea = `${m[0] + 1} / ${m[1] + 1} / ${m[2] + 2} / ${m[3] + 2}`;
    el.appendChild(d);
  };
  (steps[step] || []).forEach(i => place("now", moves[i]));
  (steps[step + 1] || []).forEach(i => place("next", moves[i]));
  const total = board.filter(v => v).length;
  $("score").innerHTML = state.solving ? `… <small>/ ${total}</small>` : board.length ? `${state.score} <small>/ ${total}</small>` : "– <small>/ –</small>";
  $("stepinfo").textContent = steps.length ? `${Math.min(step + 1, steps.length)} / ${steps.length} 단계 · 현재 ${removed}점` : (state.solving ? "탐색 중…" : "–");
  const cur = (steps[step] || []).map(i => moves[i]);
  $("cur").textContent = cur.length > 1 ? `꽉 찬 사각형 ${cur.length}개 한꺼번에 · 사과 ${cur.reduce((a, m) => a + m[4], 0)}개`
    : cur.length ? `${cur[0][0] + 1}~${cur[0][2] + 1}행, ${cur[0][1] + 1}~${cur[0][3] + 1}열 · 사과 ${cur[0][4]}개`
    : (moves.length ? "끝. 더 지울 수 있는 사각형이 없습니다." : "–");
  $("prev").disabled = step === 0; $("next").disabled = step >= steps.length;
  const ol = $("moves");
  if (ol.childElementCount !== moves.length) {
    ol.innerHTML = moves.map((m, k) => `<li data-k="${k}"><span>${k + 1}.</span><span>${m[0] + 1}-${m[2] + 1}행 ${m[1] + 1}-${m[3] + 1}열</span><span>+${m[4]}</span></li>`).join("");
  }
  ol.querySelectorAll("li").forEach((li, k) => { li.classList.toggle("done", stepOf[k] < step); li.classList.toggle("on", stepOf[k] === step); });
  const on = ol.children[(steps[step] || [])[0]]; if (on) on.scrollIntoView({ block: "nearest" });
}

function go(d) { const s = Math.max(0, Math.min(state.steps.length, state.step + d)); if (s !== state.step) { state.step = s; render(); } }
$("next").onclick = () => go(1);
$("prev").onclick = () => go(-1);
$("resolve").onclick = () => { if (!state.solving) solve(); };
$("moves").onclick = e => { const li = e.target.closest("li"); if (li) { state.step = state.steps.findIndex(s => s.includes(+li.dataset.k)); render(); } };
$("board").onclick = e => {
  const b = e.target.closest(".cell"); if (!b) return;
  state.sel = state.sel === +b.dataset.i ? -1 : +b.dataset.i; render();
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.ctrlKey || e.metaKey || e.altKey) return;
  if (state.sel >= 0 && /^[0-9]$/.test(e.key)) {
    state.board[state.sel] = +e.key; state.low.delete(state.sel); state.sel = -1;
    e.preventDefault(); loadBoard(state.board, state.R, state.C, state.low, "칸을 고쳤습니다. 다시 탐색합니다.");
    return;
  }
  if (e.key === "Escape") { state.sel = -1; render(); return; }
  if (e.key === " " || e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); go(1); }
  else if (e.key === "ArrowLeft" || e.key === "Backspace") { e.preventDefault(); go(-1); }
});

document.addEventListener("paste", e => {
  const item = [...(e.clipboardData?.items || [])].find(it => it.type.startsWith("image/"));
  if (item) { e.preventDefault(); handleImage(item.getAsFile()); }
  else setStatus("클립보드에 이미지가 없습니다. 화면을 캡처한 뒤 다시 붙여넣어 주세요.", true);
});
const drop = $("drop");
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); handleImage(e.dataTransfer.files[0]); });
$("file").addEventListener("change", e => { handleImage(e.target.files[0]); e.target.value = ""; });

loadBoard(Array.from(SAMPLE.replace(/ /g, ""), Number), 10, 17, new Set(), "예시: 처음 보내주신 판");
</script>
